# catalogs.sample.yml — Phase 2 의존성 카탈로그 준비
# 참고: https://yarnpkg.com/features/catalogs
#
# 사용 방법:
# 1. .yarnrc.yml에 아래 catalogs 블록 추가
# 2. 각 package.json의 버전을 "catalog:<name>" 참조로 교체
#    예: "react": "catalog:react19"
# 3. yarn install 실행

# .yarnrc.yml에 추가할 내용:
# ---
# catalogs:
#   default:
#     typescript: "^5.8.3"
#     eslint: "^9.0.0"
#     zod: "^3.25.23"
#     turbo: "^2.5.4"
#
#   react19:
#     react: "19.2.4"
#     react-dom: "19.2.4"
#     "@types/react": "^19"
#     "@types/react-dom": "^19"
#
#   next16:
#     next: "16.2.4"
#     eslint-config-next: "16.2.4"
#
#   tanstack:
#     "@tanstack/react-query": "^5.76.1"
#
#   tailwind4:
#     tailwindcss: "^4"
#     "@tailwindcss/postcss": "^4"
#
#   typescript-eslint:
#     "@typescript-eslint/eslint-plugin": "^8.32.1"
#     "@typescript-eslint/parser": "^8.32.1"
# ---
#
# package.json 변환 예시:
# Before: "react": "19.2.4"
# After:  "react": "catalog:react19"
